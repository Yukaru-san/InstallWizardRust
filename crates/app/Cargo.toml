[package]
name = "installwizard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "installwizard"
path = "src/main.rs"

[dependencies]
installwizard-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
sha2.workspace = true
hex.workspace = true
image.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
installwizard-native = { path = "../native" }
clap = { version = "4", features = ["derive"] }
rfd = "0.15"
sys-locale = "0.3"
ctrlc = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlInputElement", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Worker", "MessageEvent", "Event", "Element", "HtmlElement", "Navigator"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
