[workspace]
members = ["crates/core", "crates/native", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Yukaru-san"]
license = "MIT"
repository = "https://github.com/Yukaru-san/InstallWizardRust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0
